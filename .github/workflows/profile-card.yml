name: Profile card

on:
  schedule:
    - cron: "15 0 * * *" # daily, 00:15 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - generate.py
      - profile.json
      - luffy.txt
      - .github/workflows/profile-card.yml

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render dark_mode.svg / light_mode.svg
        env:
          # ACCESS_TOKEN = classic PAT with read:user + repo, so private
          # contributions are counted. Falls back to the ephemeral job token,
          # which sees public data only.
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
        run: python3 generate.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg loc_cache.json
          git diff --quiet --cached || git commit -m "chore: refresh profile card"
          git push
